services:
  - type: web
    name: cafe-pont
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && npm install && npm run build
    startCommand: python server/main.py
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_PATH
        value: /var/data/cafe-pont.db
    disk:
      name: cafe-pont-data
      mountPath: /var/data
      sizeGB: 1