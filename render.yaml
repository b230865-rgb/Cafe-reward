services:
  - type: web
    name: cafe-pont
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_PATH
        value: /var/data/cafe-pont.db
    disk:
      name: cafe-pont-data
      mountPath: /var/data
      sizeGB: 1