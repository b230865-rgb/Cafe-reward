services:
  - type: web
    name: cafe-pont
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20
    disk:
      name: cafe-pont-data
      mountPath: /opt/render/project/src/server
      sizeGB: 1